<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale/user-scalable=no here — that blocks pinch-zoom,
         which low-vision users rely on to enlarge content (WCAG 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO:START — this block is replaced per-request by server/seo.ts with
         route-specific title/description/canonical/OG/JSON-LD. What's here
         is only the fallback for a raw file preview / build artifact. -->
    <title>AFTR — After Dark Socials</title>
    <meta
      name="description"
      content="AFTR by After Dark Socials — Mauritius rave events, nightlife experiences, tickets, and the exclusive ACCESS VIP lounge."
    />
    <link rel="canonical" href="https://aftr.events/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AFTR — After Dark Socials" />
    <meta property="og:title" content="AFTR — After Dark Socials" />
    <meta
      property="og:description"
      content="Mauritius rave events, nightlife experiences, tickets, and the exclusive ACCESS VIP lounge."
    />
    <meta property="og:url" content="https://aftr.events/" />
    <meta property="og:image" content="https://aftr.events/favicon.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- SEO:END -->

    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded non-render-blocking: the browser fetches it at low priority
         via the preload, and only swaps it in as an active stylesheet once
         it arrives — first paint doesn't wait on this request. The
         <noscript> covers the (rare) no-JS case, which the "as style"
         preload's own async swap can't cover on its own. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script
      type="text/javascript"
      src="https://replit.com/public/js/replit-dev-banner.js"
    ></script>
  </body>
</html>
